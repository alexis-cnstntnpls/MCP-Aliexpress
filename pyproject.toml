[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aliexpress-mcp"
version = "0.1.0"
description = "Serveur MCP pour AliExpress France (recherche, fiches produits et avis clients)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.17.0",
    "mcp>=2.3.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
]

[project.scripts]
aliexpress-mcp = "aliexpress_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
